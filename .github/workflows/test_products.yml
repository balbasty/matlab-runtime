name: Partial install tests
on:
  workflow_dispatch:
    inputs:
      checkout:
        description: 'Commit / Branch / Tag / SHA to checkout'
        required: false
        default: ''
        type: string
  push:
    branches:
      - claude/feat/runtime-product-selection

jobs:
  run-partial-install:
    name: ${{ matrix.os }} ${{ matrix.release }} (${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    # Pre-R2019a installers are not expected to support product selection
    continue-on-error: ${{ matrix.legacy || false }}
    strategy:
      fail-fast: False
      matrix:
        include:
          # --- R2024b: test CTF compiled with this release ---------------
          - {os: ubuntu-latest,  release: R2024b, mode: ctf,      run-ctf: true}
          - {os: ubuntu-latest,  release: R2024b, mode: products, run-ctf: true}
          - {os: windows-latest, release: R2024b, mode: ctf,      run-ctf: true}
          - {os: windows-latest, release: R2024b, mode: products, run-ctf: true}
          - {os: macos-latest,   release: R2024b, mode: ctf,      run-ctf: true}
          - {os: macos-latest,   release: R2024b, mode: products, run-ctf: true}
          # --- Other releases: product selection only -----------------
          - {os: ubuntu-latest,  release: R2019b, mode: numerics}
          - {os: ubuntu-latest,  release: R2021b, mode: numerics}
          - {os: ubuntu-latest,  release: R2023b, mode: numerics}
          - {os: ubuntu-latest,  release: R2026a, mode: numerics}
          - {os: windows-latest, release: R2019b, mode: numerics}
          - {os: windows-latest, release: R2022a, mode: numerics}
          - {os: windows-latest, release: R2026a, mode: numerics}
          - {os: macos-latest,   release: R2023b, mode: numerics}
          - {os: macos-latest,   release: R2026a, mode: numerics}
          # --- Legacy installers (no product selection expected) -------
          - {os: ubuntu-latest,  release: R2018b, mode: numerics, legacy: true}
          - {os: windows-latest, release: R2018b, mode: numerics, legacy: true}
    defaults:
      run:
        shell: bash

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout }}

      - name: Install
        run: python -m pip install ".[test]"

      - name: Guess prefix
        id: prefix
        run: |
          PREFIX=$(python -c "import os.path as op; from tempfile import gettempdir; from matlab_runtime import guess_arch, guess_prefix; print(guess_prefix() if guess_arch()[:3] == 'mac' else op.join(gettempdir(), 'MATLAB', 'MATLAB_Runtime'))")
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Select products
        id: select
        run: |
          case "${{ matrix.mode }}" in
            ctf)      echo 'args=--ctf tests/_test_runtime/_test_runtime.ctf' >> "$GITHUB_OUTPUT" ;;
            products) echo 'args=--products Numerics "MATLAB Runtime - Python"' >> "$GITHUB_OUTPUT" ;;
            numerics) echo 'args=--products Numerics' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install runtime subset
        run: >
          install_matlab_runtime -v ${{ matrix.release }} -y
          --prefix "${{ steps.prefix.outputs.prefix }}"
          --tmpdir "${{ runner.temp }}/mr_tmp"
          ${{ steps.select.outputs.args }}

      - name: Show installed size
        run: du -sh "${{ steps.prefix.outputs.prefix }}"/* || true

      - name: Run deployed CTF
        if: ${{ matrix.run-ctf }}
        run: >
          ${{ runner.os == 'macOS' && 'mwpython2' || 'python' }}
          -m pytest tests/test_import.py
