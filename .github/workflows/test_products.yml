name: Partial install tests
on:
  workflow_dispatch:
    inputs:
      checkout:
        description: 'Commit / Branch / Tag / SHA to checkout'
        required: false
        default: ''
        type: string
  push:
    branches:
      - claude/feat/runtime-product-selection

jobs:
  run-partial-install:
    name: ${{ matrix.os }} ${{ matrix.release }} (${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    # Pre-R2019a installers are not expected to support product selection
    continue-on-error: ${{ matrix.legacy || false }}
    strategy:
      fail-fast: False
      matrix:
        include:
          # --- R2024b: test CTF compiled with this release ---------------
          - {os: ubuntu-latest,  release: R2024b, mode: ctf,      run-ctf: true}
          - {os: ubuntu-latest,  release: R2024b, mode: products, run-ctf: true}
          - {os: windows-latest, release: R2024b, mode: ctf,      run-ctf: true}
          - {os: windows-latest, release: R2024b, mode: products, run-ctf: true}
          - {os: macos-latest,   release: R2024b, mode: ctf,      run-ctf: true}
          - {os: macos-latest,   release: R2024b, mode: products, run-ctf: true}
          # --- Other releases: product selection only -----------------
          - {os: ubuntu-latest,  release: R2019b, mode: core}
          - {os: ubuntu-latest,  release: R2021b, mode: core}
          - {os: ubuntu-latest,  release: R2023b, mode: core}
          - {os: ubuntu-latest,  release: R2026a, mode: core}
          - {os: windows-latest, release: R2019b, mode: core}
          - {os: windows-latest, release: R2022a, mode: core}
          - {os: windows-latest, release: R2026a, mode: core}
          - {os: macos-latest,   release: R2025a, mode: core}
          - {os: macos-latest,   release: R2026a, mode: core}
          # --- Legacy installers (no product selection expected) -------
          - {os: ubuntu-latest,  release: R2018b, mode: core, legacy: true}
          - {os: windows-latest, release: R2018b, mode: core, legacy: true}
    defaults:
      run:
        shell: bash

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout }}

      - name: Install
        run: python -m pip install ".[test]"

      - name: Guess prefix
        id: prefix
        run: |
          PREFIX=$(python -c "import os.path as op; from tempfile import gettempdir; from matlab_runtime import guess_arch, guess_prefix; print(guess_prefix() if guess_arch()[:3] == 'mac' else op.join(gettempdir(), 'MATLAB', 'MATLAB_Runtime'))")
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Select products
        id: select
        run: |
          case "${{ matrix.mode }}" in
            ctf)      echo 'args=--ctf tests/_test_runtime/_test_runtime.ctf' >> "$GITHUB_OUTPUT" ;;
            products) echo 'args=--products Numerics "MATLAB Runtime - Python"' >> "$GITHUB_OUTPUT" ;;
            core)     echo 'args=--products 35010' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install runtime subset
        run: >
          install_matlab_runtime -v ${{ matrix.release }} -y
          --prefix "${{ steps.prefix.outputs.prefix }}"
          --tmpdir "${{ runner.temp }}/mr_tmp"
          ${{ steps.select.outputs.args }}

      - name: Show installed size
        if: ${{ always() }}
        run: du -sh "${{ steps.prefix.outputs.prefix }}"/* || true

      - name: Inspect install prefix on failure
        if: ${{ failure() }}
        run: |
          P="${{ steps.prefix.outputs.prefix }}"
          find "$P" -maxdepth 2 | head -50
          find "$P" -maxdepth 3 -name VersionInfo.xml -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;

      - name: Run deployed CTF
        if: ${{ matrix.run-ctf }}
        run: >
          ${{ runner.os == 'macOS' && 'mwpython2' || 'python' }}
          -m pytest tests/test_import.py

  # Temporary: show the installer_input.txt template shipped with installers
  inspect-input-template:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: False
      matrix:
        release: [R2019b, R2022a, R2024b]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
      - run: python -m pip install .
      - name: Dump template
        shell: python
        run: |
          import urllib.request, zipfile, re
          from matlab_runtime.utils import guess_installer
          url = guess_installer("${{ matrix.release }}", "glnxa64")
          print(url)
          urllib.request.urlretrieve(url, "rt.zip")
          z = zipfile.ZipFile("rt.zip")
          for n in z.namelist():
              if re.search(r"installer_input|product", n.split("/")[-1], re.I) and n.count("/") <= 1:
                  print("--", n)
          for n in z.namelist():
              if n.endswith("installer_input.txt"):
                  print("==", n)
                  print(z.read(n).decode(errors="replace"))
