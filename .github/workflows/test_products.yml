name: Partial install tests
on:
  workflow_dispatch:
    inputs:
      checkout:
        description: 'Commit / Branch / Tag / SHA to checkout'
        required: false
        default: ''
        type: string
  push:
    branches:
      - claude/feat/runtime-product-selection

jobs:
  run-partial-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: False
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [ctf, products]
        include:
          - os: ubuntu-latest
            python-bin: python
          - os: macos-latest
            python-bin: mwpython2
          - os: windows-latest
            python-bin: python
          - mode: ctf
            select: --ctf tests/_test_runtime/_test_runtime.ctf
          - mode: products
            select: --products Numerics "MATLAB Runtime - Python"
    defaults:
      run:
        shell: bash

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout }}

      - name: Install
        run: python -m pip install ".[test]"

      - name: Guess prefix
        id: prefix
        run: |
          PREFIX=$(python -c "import os.path as op; from tempfile import gettempdir; from matlab_runtime import guess_arch, guess_prefix; print(guess_prefix() if guess_arch()[:3] == 'mac' else op.join(gettempdir(), 'MATLAB', 'MATLAB_Runtime'))")
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Install runtime subset (${{ matrix.mode }})
        run: >
          install_matlab_runtime -v R2024b -y
          --prefix "${{ steps.prefix.outputs.prefix }}"
          --tmpdir "${{ runner.temp }}/mr_tmp"
          ${{ matrix.select }}

      - name: Show installed size
        run: du -sh "${{ steps.prefix.outputs.prefix }}"/* || true

      - name: Run deployed CTF
        run: ${{ matrix.python-bin }} -m pytest tests/test_import.py
