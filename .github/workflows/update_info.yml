name: Update info.json
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'  # Mondays, 06:17 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe MathWorks for latest updates
        run: python scripts/update_info.py
      - name: Summarize changes
        id: diff
        run: |
          if git diff --quiet -- matlab_runtime/info.json; then
            echo "info.json is up to date." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo '```diff'
              git diff -- matlab_runtime/info.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open / update PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-info-json
          add-paths: matlab_runtime/info.json
          commit-message: 'chore: bump MATLAB Runtime update numbers in info.json'
          title: 'chore: bump MATLAB Runtime update numbers in info.json'
          body: |
            Automated update from `scripts/update_info.py`, which probes the
            glnxa64 MATLAB Runtime installers on ssd.mathworks.com for the
            latest available update of each release (and new releases).

            If a new release was added, remember to also add its entry to
            `SUPPORTED_PYTHON_VERSIONS`.
          delete-branch: true
